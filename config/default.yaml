# PointStream default configuration.
# Generated from src.contracts.config.render_default() so every key is a real field.
# Do not add knobs here that the schema does not have.

run:
  source: null
  output-root: outputs
  max-frames: null
  chunk-duration-sec: 2.0
  seed: 1337
  log-level: info
domain: tennis
lattice:
  scene-classification: true
  detection: true
  selection: true
  tracking: true
  appearance: true
  motion: true
  temporal-policy: true
  pose: true
  segmentation: true
  rigid-objects: true
  background: true
  generation: false
  residual: true
detector:
  backend: yolo
  model: yolo26n.pt
  prompt: null
selection:
  backend: heuristic
  model: null
  prompt: null
tracking:
  backend: tracker
  model: null
  prompt: null
pose:
  backend: yolo
  model: yolo26n-pose.pt
  prompt: null
  schema: coco-wholebody-133
segmenter:
  backend: yolo
  model: yolo26n-seg.pt
  prompt: null
