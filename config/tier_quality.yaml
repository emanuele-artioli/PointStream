# Quality complexity tier — the slowest, highest-fidelity rung.
#
# Rewritten 2026-08-25 (BP23), same reason as `tier_fast.yaml`: the previous
# file was in the retired flat schema and had never been run.
#
# Tier axis = residual coarseness. quality = `Coarseness.FINE`: no block gate
# and no background downscale, so the residual carries every pixel that changed.
# Lossless is deliberately NOT this tier — `spectrum.py` calls lossless a
# ceiling calibration, not an operating point.
#
# Perception names the extra-large backends (the dataset-curation quality tier).
# The runner binds these names (BP26).
#
# Generation stays off — see `tier_fast.yaml` for why.

run:
  seed: 1337
  log-level: info
  chunk-duration-sec: 2.0

domain: tennis

lattice:
  scene-classification: true
  detection: true
  selection: true
  tracking: true
  appearance: true
  motion: true
  temporal-policy: true
  pose: true
  segmentation: true
  rigid-objects: true
  background: true
  generation: false
  residual: true

detector:
  backend: yolo
  model: yolo26x-seg.pt
  prompt: tennis player
selection:
  backend: heuristic
tracking:
  backend: tracker
pose:
  backend: yolo
  model: yolo26x-pose.pt
segmenter:
  backend: yolo
  model: yolo26x-seg.pt
rigid:
  backend: tennis

appearance:
  representation: compressed-image
  jpeg-quality: 95
  downscale: 1

motion:
  representation: keypoints
  max-points: 64

temporal:
  metadata-sparsity: false
  generation-sparsity: false
  pipeline-sparsity: false
  delta-threshold: 20.0
  keyframe-interval: 8

background:
  method: panorama-full
  codec: jpeg
  jpeg-quality: 95

generator:
  backend: none

# Fine rung: nothing gated, nothing downscaled.
residual:
  codec: av1
  rate-control: crf
  rate: 28
  preset: "4"
  pix-fmt: yuv420p
  block-size: 8
  block-threshold: 0.0
  background-downscale: 1

fallback:
  codec: av1
  rate-control: crf
  rate: 28
  preset: "4"
  pix-fmt: yuv420p
  roi: false

transport: disk

evaluation:
  metrics: [psnr, ssim, vmaf, lpips]
