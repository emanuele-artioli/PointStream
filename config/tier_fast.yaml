# Fast complexity tier — the cheapest rung of the speed/compression ladder.
#
# Rewritten 2026-08-25 (BP23). The previous version of this file was written in
# the retired flat schema (`run-mode`, `genai-backend`, `controlnet-steps`, ...).
# Every one of its keys was rejected by `src/contracts/config.py`; it had never
# been run. See `outputs/bp23-tier/report.json`.
#
# Only keys naming a real field exist here — the schema rejects anything it does
# not recognise, which is what stops a documented-but-unreachable knob producing
# a clean, plausible, entirely fictional ablation.
#
# The tier axis is **residual coarseness**, the rate axis defined in
# `src/pipeline/residual/spectrum.py`. fast = `Coarseness.COARSE`.
#
# Generation is off in all three tiers. Every engine on the roster loses to
# pasting the keyframe (`PLAN.md` 2.10), so a tier that switched one on would be
# measuring a known negative rather than a tier. With generation off the subjects
# land in the residual, which is what the lattice says an off stage means.

run:
  seed: 1337
  log-level: info
  chunk-duration-sec: 2.0

domain: tennis

lattice:
  scene-classification: true
  detection: true
  selection: true
  tracking: true
  appearance: true
  motion: true
  temporal-policy: true
  pose: true
  segmentation: true
  rigid-objects: true
  background: true
  generation: false
  residual: true

# Perception: nano-tier backends, the real-time class.
#
# Measured in BP23 and true as of that date: the runner's default stage
# callables for these axes are pass-throughs — they forward artifacts the caller
# put on the bag and do not load a detector. Changing the names below therefore
# changes nothing in a run today. They state the tier's intent; they do not yet
# drive it.
detector:
  backend: yolo
  model: yolo26n.pt
  prompt: tennis player
selection:
  backend: heuristic
tracking:
  backend: tracker
pose:
  backend: yolo
  model: yolo26n-pose.pt
segmenter:
  backend: yolo
  model: yolo26n-seg.pt
rigid:
  backend: tennis

appearance:
  representation: compressed-image
  jpeg-quality: 85
  downscale: 2

motion:
  representation: keypoints
  max-points: 64

temporal:
  metadata-sparsity: true
  generation-sparsity: false
  pipeline-sparsity: true
  delta-threshold: 20.0
  keyframe-interval: 8

background:
  method: panorama-full
  codec: jpeg
  jpeg-quality: 50

generator:
  backend: none

# Coarse rung: zero blocks whose mean absolute error is under 16 grey levels,
# and carry the background residual at quarter resolution.
residual:
  codec: av1
  rate-control: crf
  rate: 63
  preset: "10"
  pix-fmt: yuv420p
  block-size: 16
  block-threshold: 16.0
  background-downscale: 4

fallback:
  codec: av1
  rate-control: crf
  rate: 35
  preset: "10"
  pix-fmt: yuv420p
  roi: false

transport: disk

evaluation:
  metrics: [psnr]
