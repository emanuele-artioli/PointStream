# Balanced complexity tier — the middle rung of the speed/compression ladder.
#
# Rewritten 2026-08-25 (BP23), same reason as `tier_fast.yaml`: the previous
# file was in the retired flat schema and had never been run.
#
# Tier axis = residual coarseness. balanced = `Coarseness.MEDIUM`: the block
# gate drops to 4 grey levels and the background residual is carried at half
# resolution instead of a quarter. It also asks for SSIM alongside PSNR, which
# is the second axis this tier ladder actually moves today.
#
# Generation stays off — see `tier_fast.yaml` for why.

run:
  seed: 1337
  log-level: info
  chunk-duration-sec: 2.0

domain: tennis

lattice:
  scene-classification: true
  detection: true
  selection: true
  tracking: true
  appearance: true
  motion: true
  temporal-policy: true
  pose: true
  segmentation: true
  rigid-objects: true
  background: true
  generation: false
  residual: true

detector:
  backend: yolo
  model: yolo26n.pt
  prompt: tennis player
selection:
  backend: heuristic
tracking:
  backend: tracker
pose:
  backend: yolo
  model: yolo26n-pose.pt
segmenter:
  backend: yolo
  model: yolo26n-seg.pt
rigid:
  backend: tennis

appearance:
  representation: compressed-image
  jpeg-quality: 90
  downscale: 1

motion:
  representation: keypoints
  max-points: 64

temporal:
  metadata-sparsity: true
  generation-sparsity: false
  pipeline-sparsity: false
  delta-threshold: 20.0
  keyframe-interval: 8

background:
  method: panorama-full
  codec: jpeg
  jpeg-quality: 75

generator:
  backend: none

# Medium rung.
residual:
  codec: av1
  rate-control: crf
  rate: 45
  preset: "8"
  pix-fmt: yuv420p
  block-size: 8
  block-threshold: 4.0
  background-downscale: 2

fallback:
  codec: av1
  rate-control: crf
  rate: 35
  preset: "8"
  pix-fmt: yuv420p
  roi: false

transport: disk

evaluation:
  metrics: [psnr, ssim]
