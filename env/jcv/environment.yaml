# pointstream-jcv: JointControlVideo (H3e's hand generator) on Wan2.1-I2V-14B.
# A second environment because JointControlVideo pins transformers 4.57.2, which
# requires huggingface_hub < 1.0, against huggingface_hub 2.x in `pointstream`,
# and accelerate 1.12 against NVRC's 1.3.0 (docs/resources.md#environments).
# It is called only through experiments/visor/h3e_generate.py (npz in, npz out).
# Build: env/jcv/build.sh ROOT. Since 2026-10-22 it also holds Moore-AnimateAnyone
# (K6b; same conflict), added by env/jcv/extend-animateanyone.sh and called only
# through experiments/tennis/k6b_generate.py.
name: pointstream-jcv
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.12
  - pip
  - pip:
      - -r requirements.txt  # relative to this file (conda resolves it so)
