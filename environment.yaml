# The PointStream environment: one prefix for every phase-1 component.
# Build it with env/build.sh, which also installs the pinned no-deps packages,
# the DCVC-UF and WiLoR sources and the DCVC extensions, then writes the locks
# in env/locks/. The audit and its reasons: docs/resources.md#environments.
name: pointstream
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.12
  - pip
  # Native codec tools. ffmpeg links libsvtav1 and libdav1d; the SvtAv1EncApp
  # and dav1d command-line tools come from their own packages.
  - ffmpeg=8.1
  - svt-av1
  - dav1d
  - pip:
      - -r env/requirements.txt
