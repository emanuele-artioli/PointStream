name: pointstream-ci

# main is expected green; a red main is a merge blocker.

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # No paths: ruff and mypy check the project's configured file sets.
      - name: Ruff
        run: ruff check

      - name: Mypy
        run: mypy --config-file pyproject.toml

      - name: Tests
        run: python -m pytest
