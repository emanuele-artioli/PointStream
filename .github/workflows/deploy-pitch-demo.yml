name: Deploy pitch demo

# Publishes demo/outputs/pitch to GitHub Pages. The personal site proxies
# that tree at https://emanueleartioli.com/pointstream/

on:
  push:
    branches:
      - main
    paths:
      - "demo/outputs/pitch/**"
      - "demo/outputs/results/comparison_results.json"
      - "demo/pitch/**"
      - "demo/experiments/plot_rd_curves.py"
      - ".github/workflows/deploy-pitch-demo.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install plot dependencies
        run: pip install matplotlib

      - name: Assemble public demo from comparison_results.json
        run: PYTHONPATH=. python demo/pitch/publish_site.py

      - name: Disable Jekyll
        run: touch demo/outputs/pitch/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: demo/outputs/pitch

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
