[pytest]
# Default deselects integration (needs weights), slow, and invariants (needs
# outputs/). Named-weight *structure* is unmarked and always runs; named-weight
# *existence* is marked integration so a runner without assets/weights/ stays green.
addopts = -m "not integration and not slow and not invariants" -q
markers =
    integration: Tests that require real model weights or full pipeline integration.
    slow: Tests expected to take significantly longer than unit tests.
    invariants: Checks the paper's claims against the real outputs/ tree.
testpaths =
    tests
