# Egocentric set: Egocentric-10K (builddotai) head-mounted manufacturing video,
# 1920x1080 at 30 fps, HEVC sources. Free-moving camera, so a panorama
# background is invalid. This stream does not download the dataset.
#
# Identity is the raw source video (factory, worker, video index). The demo's
# `curated/clip_NN_*` names were copies of these files (same byte size on gpu5)
# and are not identities; `curated/manifest.json` later pointed the same names
# at other factories, which is why the demo ladder was flagged in 912b0d7.
#
# Split protocol (frozen 4 October 2026):
# - development-holdout: the last 10 s of each development video. These are the
#   exact windows in pointstream-demo/holdouts/holdouts.json, already used to
#   score demo generators, so they are exposed and cannot certify a claim.
# - validation: the 10 s immediately before each development hold-out.
# - fit: everything before the validation window.
# - final-holdout: factory_003, referenced by no branch, script or result before
#   this manifest. Iteration skips it unless a caller opts in explicitly.
# Checkpoints trained before this manifest sampled seconds across whole videos;
# they are not governed by these windows and must not be scored as fit-only.
domain: egocentric
selector: identity
summary: Egocentric-10K manufacturing hands, development videos plus one unseen factory.
search_roots:
  - /home/itec/emanuele/Datasets/Egocentric-10K/raw
