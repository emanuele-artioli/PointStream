[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pointstream"
version = "0.1.0"
description = "Mock-first scaffold for an object-centric semantic neural codec pipeline"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "kornia==0.7.4",
  "msgpack==1.1.0",
  "numpy==1.26.4",
  "opencv-python-headless==4.10.0.84",
  "PyYAML==6.0.2",
  "ultralytics==8.4.6",
  "pydantic==2.11.2",
  "diffusers==0.30.3",
  "transformers==4.46.3",
  "accelerate==0.32.1",
  "omegaconf==2.3.0",
  "einops==0.8.1",
  "scikit-learn==1.3.2",
  "scipy==1.10.1",
  "mlflow==2.14.3",
  "controlnet-aux==0.0.9",
  "decord==0.6.0",
  "onnxruntime-gpu==1.16.3",
  "mediapipe==0.10.5",
  "pytorchvideo==0.1.5",
  "fvcore==0.1.5.post20221221",
  "iopath==0.1.10",
  "lpips==0.1.4",
  "DISTS-pytorch==0.1",
  "moore-animateanyone @ git+https://github.com/emanuele-artioli/Moore-AnimateAnyone.git@master"
]

[project.optional-dependencies]
dev = [
  "mypy==1.15.0",
  "pre-commit==4.1.0",
  "pytest==9.0.2",
  "ruff==0.11.2",
  # pytest and mypy read their config out of this file, and on Python 3.10
  # there is no `tomllib` in the stdlib -- so without `tomli` BOTH refuse to
  # start, with a `ModuleNotFoundError` raised from inside their own argument
  # parsing rather than anything that looks like a missing dependency. The
  # `pointstream` env was in exactly that state until 2026-09-02, which meant
  # no session could run a test locally and CI was the only gate anyone had.
  # CI never saw it because `pip install -e ".[dev]"` on 3.10 pulled tomli in
  # as a transitive dependency of something else there.
  "tomli==2.4.1; python_version < '3.11'",
  "types-PyYAML==6.0.12.20260518",
]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
# `files` IS the gate. `AGENTS.md` tells every session to run
# `mypy --config-file pyproject.toml` before merging, and CI runs exactly that
# with no path arguments — so whatever is missing here is checked by nobody.
#
# `experiments` was missing until 2026-08-31 and had accumulated nine errors
# nothing would ever have reported, in a directory `src/contracts/layers.py`
# lists as one of the five architectural layers.
#
# **Passing paths on the command line overrides this list rather than adding to
# it.** That is the trap: `mypy ... src experiments` is not a superset of the
# gate, it is a different set that silently drops `tests`. Both halves of that
# were hit in one session on 2026-08-30 — a local `src experiments` run went
# green while CI failed on a test file, and the same run found the nine errors
# CI could not see. If you want the gate, pass no paths.
files = ["src", "tests", "scripts", "experiments"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = false
check_untyped_defs = false
no_implicit_optional = true

[tool.coverage.run]
source = ["src", "scripts"]

[tool.coverage.report]
omit = [
  "config-*.py",
  "*/config-*.py",
  "src/components/generation/animate_anyone_runtime.py",
  "src/shared/tennis_dataset.py",
  "scripts/*.py",
  "scripts/benchmark_player_backends.py",
]
