[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pointstream"
version = "0.2.0"
description = "Object-centric semantic video codec"
readme = "README.md"
requires-python = ">=3.12"
# Pins match the environment lock (env/locks/pointstream.pip.txt); environment.yaml
# and env/build.sh build the full environment (docs/resources.md#environments).
dependencies = [
  "numpy==1.26.4",
  "opencv-python-headless==4.10.0.84",
  "Pillow",
  "PyYAML==6.0.2",
  "zstandard",
]

[project.optional-dependencies]
yoloe = ["ultralytics==8.4.6"]
dev = [
  "mypy==1.15.0",
  "pre-commit==4.1.0",
  "pytest==9.0.2",
  "ruff==0.11.2",
  "types-PyYAML==6.0.12.20260518",
]

[tool.setuptools.packages.find]
include = ["src*", "experiments*"]

[tool.ruff]
line-length = 100
target-version = "py312"
# Models and Datasets are links to half a million files on NFS.
extend-exclude = ["Models", "Datasets"]

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
# `files` is the gate: CI runs mypy with no path arguments, and paths on the
# command line replace this list instead of adding to it.
files = ["src", "tests", "experiments"]
exclude = ['^(Models|Datasets)/']
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = false
check_untyped_defs = false
no_implicit_optional = true
