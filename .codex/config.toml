# PointStream Codex defaults. Keep this file project-scoped so other projects
# can choose their own model budget.

[features.multi_agent_v2]
hide_spawn_agent_metadata = false
tool_namespace = "agents"

[agents.luna_medium]
description = "Cost-sensitive bounded auxiliary work"
model = "gpt-5.6-luna"
model_reasoning_effort = "medium"

[agents.terra_medium]
description = "Balanced implementation, integration, and coordination work"
model = "gpt-5.6-terra"
model_reasoning_effort = "medium"

[agents.sol_medium]
description = "Targeted repair or review after a declared acceptance failure"
model = "gpt-5.6-sol"
model_reasoning_effort = "medium"
